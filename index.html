<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极大似然估计渐近正态性演示</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        button {
            padding: 8px 15px;
            margin-right: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .slider-container {
            margin: 15px 0;
        }
        .explanation {
            background: #e9f7ef;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>极大似然估计渐近正态性演示</h1>
        
        <div class="controls">
            <div class="slider-container">
                <label for="sampleSize">样本量 (n): <span id="sampleSizeValue">30</span></label>
                <input type="range" id="sampleSize" min="5" max="200" value="30" step="5">
            </div>
            <div class="slider-container">
                <label for="numSamples">重复实验次数: <span id="numSamplesValue">100</span></label>
                <input type="range" id="numSamples" min="10" max="1000" value="100" step="10">
            </div>
            <button id="startBtn">开始模拟</button>
            <button id="resetBtn">重置</button>
        </div>
        
        <div class="chart-container">
            <canvas id="distributionChart"></canvas>
        </div>
        
        <div class="explanation">
            <h3>极大似然估计的渐近正态性解释</h3>
            <p>随着样本量n的增加，极大似然估计量θ̂的分布会:</p>
            <ol>
                <li>越来越集中在真实参数θ₀附近（相合性）</li>
                <li>分布形状越来越接近正态分布（渐近正态性）</li>
                <li>分布的方差逐渐减小，与1/√n成正比</li>
            </ol>
            <p>数学表达式: √n(θ̂ - θ₀) → N(0, I(θ₀)⁻¹)，其中I(θ₀)是Fisher信息量</p>
            <p>红色曲线表示理论上的渐近正态分布，蓝色柱状图是模拟得到的估计量分布。</p>
        </div>
    </div>

    <script>
        // 初始化图表
        const ctx = document.getElementById('distributionChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'bar',
            data: {
                datasets: [
                    {
                        label: '估计值分布',
                        data: [],
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: '理论正态分布',
                        data: [],
                        type: 'line',
                        backgroundColor: 'rgba(255, 99, 132, 0)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '估计值'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: '密度'
                        },
                        beginAtZero: true
                    }
                },
                animation: {
                    duration: 1000
                }
            }
        });

        // 获取DOM元素
        const sampleSizeSlider = document.getElementById('sampleSize');
        const numSamplesSlider = document.getElementById('numSamples');
        const sampleSizeValue = document.getElementById('sampleSizeValue');
        const numSamplesValue = document.getElementById('numSamplesValue');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 更新显示值
        sampleSizeSlider.addEventListener('input', () => {
            sampleSizeValue.textContent = sampleSizeSlider.value;
        });

        numSamplesSlider.addEventListener('input', () => {
            numSamplesValue.textContent = numSamplesSlider.value;
        });

        // 重置按钮
        resetBtn.addEventListener('click', () => {
            sampleSizeSlider.value = 30;
            numSamplesSlider.value = 100;
            sampleSizeValue.textContent = '30';
            numSamplesValue.textContent = '100';
            chart.data.datasets[0].data = [];
            chart.data.datasets[1].data = [];
            chart.update();
        });

        // 开始模拟
        startBtn.addEventListener('click', () => {
            const n = parseInt(sampleSizeSlider.value);
            const numSamples = parseInt(numSamplesSlider.value);
            
            // 真实参数 - 假设是正态分布均值
            const trueMean = 5;
            const trueStd = 2;
            
            // 模拟极大似然估计
            const estimates = [];
            for (let i = 0; i < numSamples; i++) {
                const sample = jstat.normal.sample(trueMean, trueStd, n);
                const mle = jstat.mean(sample); // 正态分布均值的MLE就是样本均值
                estimates.push(mle);
            }
            
            // 计算理论渐近分布参数
            const theoreticalMean = trueMean;
            const theoreticalStd = trueStd / Math.sqrt(n);
            
            // 创建直方图数据
            const binSize = 0.5;
            const minEst = Math.min(...estimates);
            const maxEst = Math.max(...estimates);
            const numBins = Math.ceil((maxEst - minEst) / binSize);
            
            const histogram = {};
            for (let i = 0; i < numBins; i++) {
                const binStart = minEst + i * binSize;
                const binEnd = binStart + binSize;
                histogram[binStart] = 0;
            }
            
            estimates.forEach(est => {
                const bin = Math.floor((est - minEst) / binSize) * binSize + minEst;
                histogram[bin] = (histogram[bin] || 0) + 1;
            });
            
            // 转换为图表数据格式
            const histData = Object.entries(histogram).map(([x, y]) => ({
                x: parseFloat(x) + binSize/2,
                y: y / (numSamples * binSize) // 转换为密度
            }));
            
            // 创建理论正态曲线数据
            const theoryData = [];
            const step = (maxEst - minEst) / 100;
            for (let x = minEst - 1; x <= maxEst + 1; x += step) {
                theoryData.push({
                    x: x,
                    y: jstat.normal.pdf(x, theoreticalMean, theoreticalStd)
                });
            }
            
            // 更新图表
            chart.data.datasets[0].data = histData;
            chart.data.datasets[1].data = theoryData;
            chart.update();
            
            // 添加动画效果
            animateChart();
        });

        // 图表动画效果
        function animateChart() {
            let progress = 0;
            const animationDuration = 1000; // ms
            const startTime = performance.now();
            
            function updateAnimation() {
                const currentTime = performance.now();
                progress = Math.min(1, (currentTime - startTime) / animationDuration);
                
                chart.options.animation = {
                    duration: 0,
                    onProgress: function() {
                        this.data.datasets[0]._meta[0].data.forEach((bar, i) => {
                            bar._model.y = bar._yScale.getPixelForValue(bar._y * progress);
                        });
                    }
                };
                chart.update();
                
                if (progress < 1) {
                    requestAnimationFrame(updateAnimation);
                }
            }
            
            requestAnimationFrame(updateAnimation);
        }
    </script>
</body>
</html>
